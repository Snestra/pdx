# Builds docs/ with Zensical and publishes it to GitHub Pages.
name: Documentation
on:
  push:
    branches: [main]
    paths: [docs/**, zensical.toml, mise.toml, .github/workflows/docs.yml]
  workflow_dispatch:
permissions: {}
# A new push waits for a running deploy instead of cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # mise.toml pins zensical, so the site builds with the same version as a local build.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: pipx:zensical
          # A cache restored here could slip into the published site.
          cache: false
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
