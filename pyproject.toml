[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "xpd"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Quality Assurance",
]
dynamic = ["version", "description", "readme", "keywords"]

[project.urls]
Documentation = "https://snestra.github.io/pdx/"
Repository = "https://github.com/Snestra/pdx"

[tool.maturin]
bindings = "bin"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# D: docstrings; COM812, ISC001: clash with ruff format; CPY: no copyright headers;
# T20: the helpers print their JSON result; INP001: py/ holds scripts, not a package.
ignore = ["D", "COM812", "ISC001", "CPY", "T20", "INP001"]
