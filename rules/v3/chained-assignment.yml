id: chained-assignment
language: python
severity: error
message: Chained assignment never updates the original under copy-on-write (pandas 3). Use .loc[row, col] = value.
rule:
  pattern: $DF[$A][$B] = $V
  # A string index on the left separates pandas column access from numeric grids such as grid[i][j].
  has:
    field: left
    stopBy: end
    kind: string
