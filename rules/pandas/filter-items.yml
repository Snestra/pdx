# Unsafe: indexing raises on a label that is absent, where filter skipped it. axis=, like= and
# regex= are left alone.
id: filter-items
language: python
severity: warning
message: filter(items=) skips a name that is missing without an error, and pandas 3.1 says it will be deprecated. Write $X[$L], which raises on a missing name.
rule: { pattern: $X.filter(items=$L) }
fix: $X[$L]
metadata: { fix: unsafe }
