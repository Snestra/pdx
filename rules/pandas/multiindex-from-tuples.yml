# from_tuples builds one Python tuple per row and takes the tuples apart again. A pattern that
# ends in ", $$$KW" does not match a call with one argument, so each shape has two documents.

# Unsafe: without names=, from_arrays takes the level names from the Series it is given, and
# from_tuples left them empty.
id: multiindex-from-tuples
language: python
severity: warning
message: from_tuples builds one Python tuple per row. Pass the columns to $MI.from_arrays([...]).
rule:
  any:
    - pattern: $MI.from_tuples(list(zip($$$COLS)), $$$KW)
    - pattern: $MI.from_tuples(zip($$$COLS), $$$KW)
constraints:
  MI: { regex: '(^|\.)MultiIndex$' }
fix: $MI.from_arrays([$$$COLS], $$$KW)
metadata: { fix: unsafe }
---
id: multiindex-from-tuples
