# Two for clauses that pair every value of one iterable with every value of another.
id: multiindex-from-tuples
language: python
severity: warning
message: from_tuples builds one Python tuple per row. Pass the two iterables to $MI.from_product([$X, $Y]).
rule:
  pattern: $MI.from_tuples($$$ARGS)
  has:
    field: arguments
    has: { nthChild: 1, pattern: "[($A, $B) for $A in $X for $B in $Y]" }
constraints:
  MI: { regex: '(^|\.)MultiIndex$' }
