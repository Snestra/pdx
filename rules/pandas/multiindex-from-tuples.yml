# Unsafe: from_product reads each iterable once, so an iterator that product() could not reuse
# either is the only difference, and xpd cannot see the type.
id: multiindex-from-tuples
language: python
severity: warning
message: from_tuples builds one Python tuple per row. Pass the iterables to $MI.from_product([...]).
rule:
  any:
    - pattern: $MI.from_tuples(list($P($$$ITERS)), $$$KW)
    - pattern: $MI.from_tuples($P($$$ITERS), $$$KW)
  not: { has: { field: arguments, has: { stopBy: end, kind: keyword_argument, has: { field: name, regex: ^repeat$ } } } }
constraints:
  MI: { regex: '(^|\.)MultiIndex$' }
  P: { regex: '^(itertools\.)?product$' }
fix: $MI.from_product([$$$ITERS], $$$KW)
metadata: { fix: unsafe }
