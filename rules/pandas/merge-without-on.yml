id: merge-without-on
language: python
severity: warning
message: Without on=, merge joins on every column name the two frames share, so a new shared column changes the join. Name the keys with on=.
rule:
  any:
    - pattern: $A.merge($$$ARGS)
    - pattern: pd.merge($$$ARGS)
  not:
    any:
      # A cross join by position needs no keys.
      - has: { field: arguments, has: { regex: '^["'']cross["'']$' } }
      # on given by position: merge(right, how, on) or pd.merge(left, right, how, on).
      - all:
          - not: { pattern: pd.merge($$$ARGS) }
          - has: { field: arguments, has: { nthChild: 3, not: { kind: keyword_argument } } }
      - all:
          - pattern: pd.merge($$$ARGS)
          - has: { field: arguments, has: { nthChild: 4, not: { kind: keyword_argument } } }
      - has:
          field: arguments
          has:
            kind: keyword_argument
            any:
              - has: { field: name, regex: ^(on|left_on|right_on|left_index|right_index)$ }
              - all:
                  - has: { field: name, regex: ^how$ }
                  - has: { field: value, regex: '^["'']cross["'']$' }
