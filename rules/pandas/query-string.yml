# A query string that reads like SQL belongs to a database client, so it is left alone.
id: query-string
language: python
severity: warning
message: A query string hides column names from editors and from pdx. Write df.loc[(pd.col("a") > 50) & (pd.col("b") < 0)], or df.filter(cond=...) on pandas 3.1.
rule: { pattern: $X.query($S) }
constraints:
  S: { kind: string, not: { regex: '^[rbfRBF]*["'']{1,3}\s*(?i:select|with|insert|update|delete|create|drop)\b' } }
metadata: { since: "3.1" }
