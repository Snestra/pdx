id: merge-without-validate
language: python
severity: warning
message: merge without validate= can silently duplicate rows.
rule:
  any:
    - pattern: $A.merge($$$ARGS)
    - pattern: pd.merge($$$ARGS)
  # Only the call's own arguments count, so validate= inside a nested call doesn't hide it.
  not:
    has:
      field: arguments
      has:
        kind: keyword_argument
        has:
          field: name
          regex: ^validate$
