id: index-year-mask
language: python
severity: warning
message: On a sorted DatetimeIndex, a label such as $DF.loc["2023"] selects the year without a mask over every row.
rule:
  any:
    - pattern: $DF[$DF.index.year == $Y]
    - pattern: $DF.loc[$DF.index.year == $Y]
constraints:
  Y: { kind: integer }
