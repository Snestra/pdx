# A lambda that compares its parameter with a value the parameter is not part of, so the same
# comparison runs on the whole column. Unsafe: a column of Python objects can compare differently.
id: apply-comparison
language: python
severity: warning
message: A comparison per value runs in Python. Write $NEW on the whole column.
rule:
  not: { matches: operand }
  any:
    - pattern: "$S.apply(lambda $X: $BODY)"
    - pattern: "$S.map(lambda $X: $BODY)"
constraints:
  BODY: { matches: comparison }
utils:
  comparison:
    kind: comparison_operator
    all:
      - has: { nthChild: 1, pattern: $X }
      - has: { field: operators, regex: '^(<|<=|>|>=|==|!=)$' }
      # Two operands only, so a chain such as 0 < v < 5 is left alone.
      - not: { has: { nthChild: 3 } }
      - not: { has: { nthChild: 2, any: [{ pattern: $X }, { has: { stopBy: end, pattern: $X } }] } }
  # The call is an operand, or the object of an attribute or a subscript, so the expression that
  # replaces it needs parentheses.
  operand:
    inside:
      any:
        - kind: binary_operator
        - kind: unary_operator
        - kind: boolean_operator
        - kind: not_operator
        - kind: comparison_operator
        - kind: attribute
        - kind: subscript
        - kind: await
rewriters:
  - id: parameter
    rule: { kind: identifier, pattern: $X }
    fix: $S
transform:
  NEW: { rewrite: { source: $BODY, rewriters: [parameter] } }
fix: $NEW
metadata: { fix: unsafe }
