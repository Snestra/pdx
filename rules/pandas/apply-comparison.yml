# Unsafe: isin compares values, where `in` asks the container, so a dict, a range or a custom
# container can answer differently. A text container is a substring test and is left alone.
id: apply-comparison
language: python
severity: warning
message: A membership test per value runs in Python. Write $S.isin($C) on the whole column.
rule:
  any:
    - pattern: "$S.apply(lambda $X: $X in $C)"
    - pattern: "$S.map(lambda $X: $X in $C)"
constraints:
  C: { not: { any: [{ kind: string }, { pattern: $X }, { has: { stopBy: end, pattern: $X } }] } }
fix: $S.isin($C)
metadata: { fix: unsafe }
---
# ~ binds before a method call or a subscript, so the negated form keeps its own parentheses.
id: apply-comparison
language: python
severity: warning
message: A membership test per value runs in Python. Write ~$S.isin($C) on the whole column.
rule:
  any:
    - pattern: "$S.apply(lambda $X: $X not in $C)"
    - pattern: "$S.map(lambda $X: $X not in $C)"
constraints:
  C: { not: { any: [{ kind: string }, { pattern: $X }, { has: { stopBy: end, pattern: $X } }] } }
fix: (~$S.isin($C))
metadata: { fix: unsafe }
