# inplace-on-column reports an inplace call on a selected column, and inplace-result-assigned
# reports one whose result is assigned. This rule reports every other inplace call.

# A call that stands alone as a statement, on a receiver that can be assigned to, can be
# rewritten to reassign its result.
id: no-inplace
language: python
severity: warning
message: inplace=True gives no speedup and blocks chaining. Reassign instead.
rule:
  pattern: $OBJ.$M($$$ARGS)
  inside: { kind: expression_statement }
  has: { field: arguments, has: { matches: inplace-true } }
constraints:
  OBJ: { all: [{ matches: assignable }, { not: { matches: selection } }] }
utils:
  assignable:
    any: [{ kind: identifier }, { kind: attribute }, { kind: subscript }]
  selection:
    kind: subscript
    any:
      - has: { field: subscript, any: [{ kind: string }, { kind: list }] }
      - has: { field: value, kind: attribute, has: { field: attribute, regex: ^(loc|iloc)$ } }
  inplace-true:
    kind: keyword_argument
    all:
      - has: { field: name, regex: ^inplace$ }
      - has: { field: value, regex: ^True$ }
# Keep every argument but inplace=True, each followed by ", ", then trim the last separator.
# Comments between the arguments are dropped.
rewriters:
  - id: drop-inplace
    rule: { kind: keyword_argument, has: { field: name, regex: ^inplace$ } }
    fix: ""
  - id: keep-argument
    rule:
      pattern: $ARG
      not:
        any:
          - kind: comment
          - kind: keyword_argument
            has: { field: name, regex: ^inplace$ }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [drop-inplace, keep-argument], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
# Unsafe: other names bound to the same object no longer see the change.
fix: $OBJ = $OBJ.$M($REST)
metadata: { fix: unsafe }
---
# Any other call with inplace=True, such as one passed to another function, has no fix.
id: no-inplace
language: python
severity: warning
message: inplace=True gives no speedup and blocks chaining. Reassign instead.
rule:
  kind: call
  has: { field: arguments, has: { matches: inplace-true } }
  not:
    any:
      - all:
          - has: { field: function, kind: attribute, has: { field: object, matches: assignable } }
          - inside: { kind: expression_statement }
      - all:
          - has: { field: function, kind: attribute }
          - inside: { kind: assignment, field: right }
utils:
  assignable:
    any: [{ kind: identifier }, { kind: attribute }, { kind: subscript }]
  inplace-true:
    kind: keyword_argument
    all:
      - has: { field: name, regex: ^inplace$ }
      - has: { field: value, regex: ^True$ }
