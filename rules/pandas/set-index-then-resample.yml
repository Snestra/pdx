# resample takes on=, so a datetime column does not have to become the index first. The fix
# applies when a named aggregation follows, directly or after selecting columns. Upsampling with
# asfreq, ffill or interpolate raises with on=, and a function passed to agg or apply sees other
# data, so those calls are left alone.
id: set-index-then-resample
language: python
severity: warning
message: resample takes on=, so the column does not have to become the index first. Write $X.resample($$$A, on=$COL).
rule:
  pattern: $X.set_index($COL).resample($$$A)
  not:
    has:
      field: arguments
      has: { kind: keyword_argument, has: { field: name, regex: ^(on|level)$ } }
  any:
    - matches: aggregated
    - inside: { kind: subscript, field: value, matches: aggregated }
constraints:
  COL: { kind: string }
utils:
  aggregated:
    inside:
      kind: attribute
      field: object
      has: { field: attribute, regex: ^(sum|mean|min|max|median|std|var|sem|count|size|first|last|ohlc|nunique|prod)$ }
fix: $X.resample($$$A, on=$COL)
metadata: { fix: safe }
