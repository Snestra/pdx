id: compare-to-missing
language: python
severity: error
message: A comparison with a missing value is always true, missing or not. Write $X.notna() instead.
rule: { pattern: $X != $M }
constraints:
  M: { matches: missing }
  X: { matches: primary }
utils:
  missing: { regex: '^(np\.(nan|NaN|NAN)|pd\.(NA|NaT)|math\.nan|float\(["'']nan["'']\))$' }
  primary: { any: [{ kind: identifier }, { kind: attribute }, { kind: subscript }, { kind: call }, { kind: parenthesized_expression }] }
fix: $X.notna()
metadata: { fix: unsafe }
