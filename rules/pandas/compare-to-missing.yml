# astype(str) keeps missing values missing in pandas 3, so the text "nan" never appears.
id: compare-to-missing
language: python
severity: error
message: astype(str) keeps missing values missing in pandas 3, so this text never matches them. Write $X.isna() instead.
rule: { pattern: $X.astype(str) == $T }
constraints:
  T: { matches: missing-text }
utils:
  missing-text: { regex: '^["''](nan|NaN|None|<NA>|NaT)["'']$' }
fix: $X.isna()
metadata: { fix: unsafe }
---
id: compare-to-missing
language: python
severity: error
message: astype(str) keeps missing values missing in pandas 3, so this text never matches them. Write $X.notna() instead.
rule: { pattern: $X.astype(str) != $T }
constraints:
  T: { matches: missing-text }
utils:
  missing-text: { regex: '^["''](nan|NaN|None|<NA>|NaT)["'']$' }
fix: $X.notna()
metadata: { fix: unsafe }
