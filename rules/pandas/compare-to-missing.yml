# A comparison with a missing value is False for every row, missing or not. The fixes are
# unsafe, because on a single value instead of a column, .isna() raises AttributeError.

id: compare-to-missing
language: python
severity: error
message: A comparison with a missing value is never true. Write $X.isna() instead.
rule: { pattern: $X == $M }
constraints:
  M: { matches: missing }
  X: { matches: primary }
utils:
  missing: { regex: '^(np\.(nan|NaN|NAN)|pd\.(NA|NaT)|math\.nan|float\(["'']nan["'']\))$' }
  primary: { any: [{ kind: identifier }, { kind: attribute }, { kind: subscript }, { kind: call }, { kind: parenthesized_expression }] }
fix: $X.isna()
metadata: { fix: unsafe }
---
id: compare-to-missing
language: python
severity: error
message: A comparison with a missing value is never true. Write ($X).isna() instead.
rule: { pattern: $X == $M }
constraints:
  M: { matches: missing }
  X: { not: { matches: primary } }
utils:
  missing: { regex: '^(np\.(nan|NaN|NAN)|pd\.(NA|NaT)|math\.nan|float\(["'']nan["'']\))$' }
  primary: { any: [{ kind: identifier }, { kind: attribute }, { kind: subscript }, { kind: call }, { kind: parenthesized_expression }] }
fix: ($X).isna()
metadata: { fix: unsafe }
