# Unsafe: nsmallest and nlargest raise on a text column, and they order ties differently.
id: sort-then-head
language: python
severity: warning
message: nsmallest finds the rows without sorting the whole frame. Write $X.nsmallest($N, $C).
rule: { pattern: "$X.sort_values($C).head($N)" }
constraints:
  C: { kind: string }
fix: $X.nsmallest($N, $C)
metadata: { fix: unsafe }
---
id: sort-then-head
language: python
severity: warning
message: nlargest finds the rows without sorting the whole frame. Write $X.nlargest($N, $C).
rule: { pattern: "$X.sort_values($C, ascending=False).head($N)" }
constraints:
  C: { kind: string }
fix: $X.nlargest($N, $C)
metadata: { fix: unsafe }
---
id: sort-then-head
language: python
severity: warning
message: nsmallest finds the values without sorting the whole column. Write $X.nsmallest($N).
rule: { pattern: "$X.sort_values().head($N)" }
fix: $X.nsmallest($N)
metadata: { fix: unsafe }
---
id: sort-then-head
language: python
severity: warning
message: idxmin finds the row without sorting the whole frame. Write $X.loc[$X[$C].idxmin()].
rule: { pattern: "$X.sort_values($C).iloc[0]" }
constraints:
  C: { kind: string }
  X: { any: [{ kind: identifier }, { kind: attribute }] }
fix: $X.loc[$X[$C].idxmin()]
metadata: { fix: unsafe }
---
id: sort-then-head
language: python
severity: warning
message: idxmax finds the row without sorting the whole frame. Write $X.loc[$X[$C].idxmax()].
rule: { pattern: "$X.sort_values($C, ascending=False).iloc[0]" }
constraints:
  C: { kind: string }
  X: { any: [{ kind: identifier }, { kind: attribute }] }
fix: $X.loc[$X[$C].idxmax()]
metadata: { fix: unsafe }
