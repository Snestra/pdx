# Unsafe: nsmallest and nlargest raise on a text column, and they order ties differently. The
# row form uses argmin, a position, so a repeated index label still gives one row, and it raises
# when every value in the column is missing, where the sort returned the first row.
id: sort-then-head
language: python
severity: warning
message: nsmallest finds the rows without sorting the whole frame. Write $X.nsmallest($N, $C).
rule: { pattern: "$X.sort_values($C).head($N)" }
constraints:
  C: { kind: string }
fix: $X.nsmallest($N, $C)
metadata: { fix: unsafe }
---
id: sort-then-head
language: python
severity: warning
message: nlargest finds the rows without sorting the whole frame. Write $X.nlargest($N, $C).
rule: { pattern: "$X.sort_values($C, ascending=False).head($N)" }
constraints:
  C: { kind: string }
fix: $X.nlargest($N, $C)
metadata: { fix: unsafe }
---
id: sort-then-head
language: python
severity: warning
message: nsmallest finds the values without sorting the whole column. Write $X.nsmallest($N).
rule: { pattern: "$X.sort_values().head($N)" }
fix: $X.nsmallest($N)
metadata: { fix: unsafe }
---
id: sort-then-head
language: python
severity: warning
message: argmin finds the row without sorting the whole frame. Write $X.iloc[$X[$C].argmin()].
rule: { pattern: "$X.sort_values($C).iloc[0]" }
constraints:
  C: { kind: string }
  X: { any: [{ kind: identifier }, { kind: attribute }] }
fix: $X.iloc[$X[$C].argmin()]
metadata: { fix: unsafe }
---
id: sort-then-head
language: python
severity: warning
message: argmax finds the row without sorting the whole frame. Write $X.iloc[$X[$C].argmax()].
rule: { pattern: "$X.sort_values($C, ascending=False).iloc[0]" }
constraints:
  C: { kind: string }
  X: { any: [{ kind: identifier }, { kind: attribute }] }
fix: $X.iloc[$X[$C].argmax()]
metadata: { fix: unsafe }
---
# A sorted column read at one end, a frame read at its last rows, and sorted() on a column.
id: sort-then-head
language: python
severity: warning
message: This sorts the whole column to read one value. Call $S.min().
rule:
  any:
    - pattern: $S.sort_values().iloc[0]
    - pattern: $S.sort_values().values[0]
fix: $S.min()
metadata: { fix: unsafe }
---
id: sort-then-head
language: python
severity: warning
message: This sorts the whole column to read one value. Call $S.max().
rule:
  any:
    - pattern: $S.sort_values(ascending=False).iloc[0]
    - pattern: $S.sort_values(ascending=False).values[0]
fix: $S.max()
metadata: { fix: unsafe }
---
id: sort-then-head
language: python
severity: warning
message: This sorts the whole column to read its last value, which is NaN when a value is missing. Call $S.max().
rule:
  pattern: $S.sort_values().iloc[-1]
---
id: sort-then-head
language: python
severity: warning
message: This sorts the whole column to read one label. Call $S.idxmin().
rule:
  pattern: $S.sort_values().index[0]
fix: $S.idxmin()
metadata: { fix: unsafe }
---
id: sort-then-head
language: python
severity: warning
message: This sorts the whole frame to read its last rows. Call nlargest, or $DF.iloc[$DF[$B].argmax()] for one row.
rule:
  any:
    - pattern: $DF.sort_values($B).iloc[-1]
    - pattern: $DF.sort_values($B).tail($N)
---
id: sort-then-head
language: python
severity: warning
message: sorted builds a Python list of every value to read one. Call min or max on the column.
rule:
  any:
    - pattern: sorted($DF[$C])[0]
    - pattern: sorted($DF[$C])[-1]
constraints:
  C: { kind: string }
