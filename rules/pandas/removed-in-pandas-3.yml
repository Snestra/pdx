# Each document finds one API that pandas 3 removed. The forms raise on pandas 3.0 and 3.1.

id: removed-in-pandas-3
language: python
severity: error
message: DataFrame.applymap was removed in pandas 3. Use map, which takes the same arguments.
rule: { pattern: $X.applymap($$$A) }
fix: $X.map($$$A)
metadata: { fix: safe }
---
# fillna(method="ffill") whose other arguments are limit, axis or inplace, which ffill takes too.
id: removed-in-pandas-3
language: python
severity: error
message: fillna(method=) was removed in pandas 3. Call ffill() instead.
rule:
  pattern: $X.fillna($$$ARGS)
  has:
    field: arguments
    has:
      kind: keyword_argument
      all:
        - has: { field: name, regex: ^method$ }
        - has: { field: value, regex: '^["''](ffill|pad)["'']$' }
  not: { has: { field: arguments, has: { not: { matches: movable } } } }
utils:
  # The brackets and commas of the argument list, comments, and the keywords ffill takes.
  movable:
    any:
      - regex: ^[(),]$
      - kind: comment
      - kind: keyword_argument
        has: { field: name, regex: ^(method|limit|axis|inplace)$ }
rewriters:
  - id: drop-method
    rule: { kind: keyword_argument, has: { field: name, regex: ^method$ } }
    fix: ""
  - id: keep-argument
    rule:
      pattern: $ARG
      not:
        any:
          - kind: comment
          - kind: keyword_argument
            has: { field: name, regex: ^method$ }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [drop-method, keep-argument], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $X.ffill($REST)
metadata: { fix: safe }
---
