  R: { regex: ^(sum|mean|std|var|prod)$ }
utils:
  reducer-call:
    kind: call
    has: { field: function, regex: '\.(agg|aggregate|transform)$' }
    not: { has: { field: function, regex: '\.(rolling|expanding|ewm|resample)\(' } }
