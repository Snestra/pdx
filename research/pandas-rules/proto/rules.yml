# Prototype pdx rules for the proposal. Each document is one ast-grep rule, in the same form
# as rules/pandas/*.yml in pdx. metadata.fix says whether the fix keeps what the code does.

# ---------------------------------------------------------------- wrong results under pandas 3
id: inplace-result-assigned
language: python
severity: error
message: An inplace call returns None, so this name is now None. Drop inplace=True.
rule:
  pattern: $NAME = $OBJ.$M($$$ARGS)
  has:
    stopBy: end
    kind: keyword_argument
    all:
      - has: { field: name, regex: ^inplace$ }
      - has: { field: value, regex: ^True$ }
---
id: epoch-from-int-cast
language: python
severity: error
message: Datetimes default to microseconds in pandas 3, so this cast no longer gives nanoseconds. Subtract the epoch and divide by a Timedelta.
rule:
  kind: binary_operator
  all:
    - has:
        field: left
        pattern: $X.astype($T)
    - has: { field: right, regex: '^(10 ?\*\* ?[369]|1e[369]|1_?000(_?000){0,2})$' }
constraints:
  T: { regex: '^("int64"|"int"|int|np\.int64|"i8")$' }
---
id: compare-to-missing
language: python
severity: error
message: A comparison with a missing value is never true. Use .isna().
rule:
  any:
    - pattern: $X == np.nan
    - pattern: $X == pd.NA
    - pattern: $X == pd.NaT
    - pattern: $X == "nan"
fix: $X.isna()
metadata: { fix: unsafe }
---
id: compare-to-missing
language: python
severity: error
message: A comparison with a missing value is never true. Use .notna().
rule:
  any:
    - pattern: $X != np.nan
    - pattern: $X != pd.NA
    - pattern: $X != pd.NaT
    - pattern: $X != "nan"
fix: $X.notna()
metadata: { fix: unsafe }
---
id: in-column
language: python
severity: error
message: "`in` on a column checks the index labels, not the values. Use .isin() or (col == value).any()."
rule:
  pattern: $V in $DF[$COL]
  kind: comparison_operator
constraints:
  COL: { kind: string }
fix: ($DF[$COL] == $V).any()
metadata: { fix: unsafe }
---
id: mask-precedence
language: python
severity: error
message: "& and | bind tighter than comparisons. Put each comparison in parentheses."
rule:
  kind: comparison_operator
  has:
    kind: binary_operator
    any:
      - pattern: $L & $R
      - pattern: $L | $R
---
id: write-through-values
language: python
severity: error
message: The array behind a column is read-only under copy-on-write. Assign with .loc instead.
rule:
  any:
    - pattern: $X.values[$I] = $V
    - pattern: $X.to_numpy()[$I] = $V
---
id: object-dtype-check
language: python
severity: error
message: Text columns have dtype str in pandas 3, so this check is false for them. Use pd.api.types.is_string_dtype.
rule:
  any:
    - pattern: $X.dtype == object
    - pattern: $X.dtype == "object"
    - pattern: $X.dtype == "O"
    - pattern: $X.dtype == np.object_
fix: pd.api.types.is_string_dtype($X)
metadata: { fix: unsafe }
---
# ---------------------------------------------------------------- removed in pandas 3
id: removed-in-pandas-3
language: python
severity: error
message: applymap was removed. Use map.
rule: { pattern: $X.applymap($$$A) }
fix: $X.map($$$A)
metadata: { fix: safe }
---
id: removed-in-pandas-3
language: python
severity: error
message: fillna(method=) was removed. Use ffill().
rule: { pattern: '$X.fillna(method="ffill")' }
fix: $X.ffill()
metadata: { fix: safe }
---
id: removed-in-pandas-3
language: python
severity: error
message: fillna(method=) was removed. Use bfill().
rule: { pattern: '$X.fillna(method="bfill")' }
fix: $X.bfill()
metadata: { fix: safe }
---
id: removed-in-pandas-3
language: python
severity: error
message: The "M" frequency was removed. Use "ME" for month end.
rule:
  kind: string
  regex: ^"M"$
  inside:
    stopBy: { kind: call }
    kind: call
    has: { field: function, regex: '(\.resample|date_range|Grouper)$' }
fix: '"ME"'
metadata: { fix: safe }
---
id: removed-in-pandas-3
language: python
severity: error
message: The "H" frequency was removed. Use "h".
rule:
  kind: string
  regex: ^"H"$
  inside:
    stopBy: { kind: call }
    kind: call
    has: { field: function, regex: '(\.resample|\.asfreq|\.floor|\.ceil|\.round|date_range|Grouper)$' }
fix: '"h"'
metadata: { fix: safe }
---
id: removed-in-pandas-3
language: python
severity: error
message: delim_whitespace was removed. Use sep=r"\s+".
rule:
  pattern: { context: "f(delim_whitespace=True)", selector: keyword_argument }
fix: sep=r"\s+"
metadata: { fix: safe }
---
id: removed-in-pandas-3
language: python
severity: error
message: dt.week was removed. Use dt.isocalendar().week.
rule: { pattern: $X.dt.week }
fix: $X.dt.isocalendar().week
metadata: { fix: unsafe }
---
id: deprecated-in-pandas-3
language: python
severity: warning
message: Timestamp.utcnow is deprecated. Use Timestamp.now("UTC").
rule: { pattern: pd.Timestamp.utcnow() }
fix: pd.Timestamp.now("UTC")
metadata: { fix: safe }
---
id: deprecated-in-pandas-3
language: python
severity: warning
message: Copy-on-write is always on in pandas 3. Delete this option.
rule:
  kind: expression_statement
  has:
    any:
      - pattern: pd.set_option("mode.copy_on_write", $V)
      - pattern: pd.options.mode.copy_on_write = $V
fix: ""
metadata: { fix: safe }
---
# ---------------------------------------------------------------- newest API
id: lambda-column
language: python
severity: warning
message: "Use pd.col(\"name\") in place of a lambda that only reads columns."
rule:
  pattern: "lambda $D: $BODY"
  inside:
    any:
      - kind: keyword_argument
        inside:
          kind: argument_list
          inside:
            kind: call
            has: { field: function, regex: '\.(assign|select)$' }
      - kind: subscript
        has: { field: value, regex: '\.loc$' }
  all:
    - has: { stopBy: end, kind: subscript, pattern: "$D[$_]" }
    # Every use of the parameter is d["name"].
    - not:
        has:
          stopBy: end
          kind: identifier
          pattern: $D
          not:
            any:
              - inside: { kind: lambda_parameters }
              - inside:
                  kind: subscript
                  has: { field: subscript, kind: string }
    # No other object is indexed by a string, because the rewriter cannot tell them apart.
    - not:
        has:
          stopBy: end
          kind: subscript
          has: { field: subscript, kind: string }
          not: { pattern: "$D[$_]" }
    # A plain function call such as len(...) or np.where(...) needs real data, not an expression.
    - not:
        has:
          stopBy: end
          kind: call
          has: { field: function, any: [{ kind: identifier }, { regex: '^(np|numpy|pd|pandas)\.' }] }
rewriters:
  - id: to-col
    rule:
      kind: subscript
      pattern: $OBJ[$K]
      has: { field: subscript, kind: string }
    fix: pd.col($K)
transform:
  NEW:
    rewrite: { source: $BODY, rewriters: [to-col] }
fix: $NEW
metadata: { fix: safe }
---
id: sort-then-reset-index
language: python
severity: warning
message: Pass ignore_index=True instead of a second reset_index call.
rule:
  pattern: $X.$M($$$A).reset_index(drop=True)
constraints:
  M: { regex: ^(sort_values|drop_duplicates|explode|sort_index|sample)$ }
  A: { regex: . }
fix: $X.$M($$$A, ignore_index=True)
metadata: { fix: safe }
---
id: sort-then-reset-index
language: python
severity: warning
message: Pass ignore_index=True instead of a second reset_index call.
rule:
  pattern: $X.$M().reset_index(drop=True)
constraints:
  M: { regex: ^(drop_duplicates|dropna|sort_index)$ }
fix: $X.$M(ignore_index=True)
metadata: { fix: safe }
---
id: set-index-then-resample
language: python
severity: warning
message: resample takes on=, so the column does not have to become the index first.
rule:
  pattern: $X.set_index($COL).resample($$$A)
constraints:
  COL: { kind: string }
fix: $X.resample($$$A, on=$COL)
metadata: { fix: safe }
---
id: groupby-then-reset-index
language: python
severity: warning
message: Pass as_index=False to groupby instead of resetting the index afterwards.
rule:
  pattern: $X.groupby($$$K)[$SEL].$AGG($$$A).reset_index()
constraints:
  AGG: { regex: ^(sum|mean|min|max|median|std|var|count|nunique|prod|first|last)$ }
  SEL: { kind: list }
fix: $X.groupby($$$K, as_index=False)[$SEL].$AGG($$$A)
metadata: { fix: unsafe }
---
id: concat-then-category
language: python
severity: warning
message: "pandas 3.1: concat(..., union_categories=True) keeps the categorical dtype without a second pass."
rule:
  pattern: pd.concat($$$A).astype("category")
fix: pd.concat($$$A, union_categories=True)
metadata: { fix: unsafe, since: "3.1" }
---
id: filter-items
language: python
severity: warning
message: "pandas 3.1: filter(items=) will be deprecated. Use select."
rule:
  pattern: $X.filter(items=$L)
fix: $X.select($L)
metadata: { fix: unsafe, since: "3.1" }
---
id: assign-then-select
language: python
severity: warning
message: "pandas 3.1: select picks columns and computes new ones in one call."
rule:
  pattern: $X[[$$$COLS]].assign($$$KW)
fix: $X.select($$$COLS, $$$KW)
metadata: { fix: unsafe, since: "3.1" }
---
id: query-string
language: python
severity: warning
message: "A query string hides column names from tools. Use pd.col expressions with .loc, or with filter(cond=) on pandas 3.1."
rule:
  pattern: $X.query($S)
constraints:
  S: { kind: string }
---
id: nested-np-where
language: python
severity: warning
message: Nested np.where reads inside out. Use Series.case_when, or pd.cut for numeric bins.
rule:
  pattern: np.where($C, $A, $B)
  has:
    field: arguments
    has: { pattern: np.where($$$) }
---
# ---------------------------------------------------------------- vectorize
id: row-loop
language: python
severity: warning
message: A loop over rows runs in Python. Compute on whole columns instead.
rule:
  kind: for_statement
  has:
    field: right
    any:
      - pattern: $DF.iterrows()
      - pattern: $DF.itertuples($$$)
      - pattern: $DF.to_dict("records")
      - pattern: $DF.to_dict(orient="records")
---
id: row-loop
language: python
severity: warning
message: A loop over row numbers runs in Python. Compute on whole columns instead.
rule:
  pattern: |
    for $I in range(len($DF)):
        $$$BODY
  has:
    stopBy: end
    any:
      - pattern: $DF.iloc[$I]
      - pattern: $DF.loc[$I, $$$]
      - pattern: $DF.loc[$I]
      - pattern: $DF.at[$I, $$$]
      - pattern: $DF[$C][$I]
---
id: apply-axis-1
language: python
severity: warning
message: apply(axis=1) calls a Python function once per row. Compute on whole columns instead.
rule:
  pattern: $DF.apply($$$A)
  has:
    field: arguments
    has:
      kind: keyword_argument
      all:
        - has: { field: name, regex: ^axis$ }
        - has: { field: value, regex: ^(1|"columns")$ }
---
id: apply-text-method
language: python
severity: warning
message: Use the .str accessor instead of a Python function per value.
rule:
  any:
    - pattern: "$S.apply(lambda $X: $X.$M($$$A))"
    - pattern: "$S.map(lambda $X: $X.$M($$$A))"
constraints:
  M: { regex: ^(lower|upper|strip|lstrip|rstrip|title|capitalize|startswith|endswith|replace|zfill|isdigit|isnumeric|isalpha)$ }
fix: $S.str.$M($$$A)
metadata: { fix: unsafe }
---
id: apply-date-part
language: python
severity: warning
message: Use the .dt accessor instead of a Python function per value.
rule:
  any:
    - pattern: "$S.apply(lambda $X: $X.$P)"
    - pattern: "$S.map(lambda $X: $X.$P)"
constraints:
  P: { regex: ^(year|month|day|hour|minute|second|quarter|dayofweek|day_of_week|dayofyear|day_of_year|days|seconds)$ }
fix: $S.dt.$P
metadata: { fix: unsafe }
---
id: apply-known-function
language: python
severity: warning
message: pd.to_datetime takes the whole column. Calling it per value is about 1,000 times slower.
rule:
  pattern: $S.apply(pd.to_datetime)
fix: pd.to_datetime($S)
metadata: { fix: safe }
---
id: apply-known-function
language: python
severity: warning
message: Use .round() on the column.
rule:
  any:
    - pattern: "$S.apply(lambda $X: round($X, $N))"
    - pattern: "$S.map(lambda $X: round($X, $N))"
fix: $S.round($N)
metadata: { fix: unsafe }
---
id: builtin-on-column
language: python
severity: warning
message: A Python builtin walks the column one value at a time. Use the column method.
rule:
  pattern: $F($DF[$C])
constraints:
  F: { regex: ^(sum|min|max)$ }
  C: { kind: string }
fix: $DF[$C].$F()
metadata: { fix: unsafe }
---
id: groupby-lambda
language: python
severity: warning
message: "Pass the name of the reduction, such as \"mean\". A lambda runs in Python once per group."
rule:
  pattern: "lambda $X: $X.$R()"
  inside:
    kind: argument_list
    inside:
      kind: call
      has: { field: function, regex: '\.(agg|aggregate|transform)$' }
constraints:
  R: { regex: ^(sum|mean|min|max|median|std|var|count|nunique|prod)$ }
fix: '"$R"'
metadata: { fix: safe }
---
id: groupby-lambda
language: python
severity: warning
message: "Pass the name of the reduction, such as \"mean\". A numpy function runs once per group."
rule:
  pattern: np.$R
  inside:
    any:
      - kind: argument_list
        inside:
          kind: call
          has: { field: function, regex: '\.(agg|aggregate|transform)$' }
      - kind: keyword_argument
        has: { field: name, regex: ^aggfunc$ }
constraints:
  R: { regex: ^(sum|mean|min|max|median|prod)$ }
fix: '"$R"'
metadata: { fix: safe }
---
id: groupby-lambda
language: python
severity: warning
message: Call the method on the groupby. A lambda runs in Python once per group.
rule:
  pattern: "$G.transform(lambda $X: $X.$W($$$A))"
constraints:
  W: { regex: ^(cumsum|cumprod|cummax|cummin|shift|diff|ffill|bfill|rank|pct_change)$ }
fix: $G.$W($$$A)
metadata: { fix: safe }
---
id: groupby-lambda
language: python
severity: warning
message: Divide the column by transform("sum"). A lambda runs in Python once per group.
rule:
  pattern: "$DF.groupby($$$K)[$C].transform(lambda $X: $X / $X.sum())"
fix: $DF[$C] / $DF.groupby($$$K)[$C].transform("sum")
metadata: { fix: unsafe }
---
id: groupby-lambda
language: python
severity: warning
message: Compare transform("size") instead of filtering group by group.
rule:
  pattern: "$DF.groupby($K).filter(lambda $G: len($G) $OP $N)"
constraints:
  K: { kind: string }
fix: $DF[$DF.groupby($K)[$K].transform("size") $OP $N]
metadata: { fix: unsafe }
---
id: sort-then-head
language: python
severity: warning
message: nsmallest finds the rows without sorting the whole frame.
rule:
  pattern: $X.sort_values($C).head($N)
fix: $X.nsmallest($N, $C)
metadata: { fix: unsafe }
---
id: sort-then-head
language: python
severity: warning
message: nlargest finds the rows without sorting the whole frame.
rule:
  pattern: $X.sort_values($C, ascending=False).head($N)
fix: $X.nlargest($N, $C)
metadata: { fix: unsafe }
---
id: len-of-filter
language: python
severity: warning
message: Sum the mask instead of building the filtered frame to count it.
rule:
  pattern: len($DF[$MASK])
constraints:
  MASK:
    any:
      - kind: comparison_operator
      - kind: binary_operator
        has: { stopBy: end, kind: comparison_operator }
fix: int(($MASK).sum())
metadata: { fix: unsafe }
---
id: rolling-apply
language: python
severity: warning
message: Call the window method directly. rolling.apply runs a Python function once per window.
rule:
  pattern: "$R.rolling($$$W).apply(lambda $X: $X.$F())"
constraints:
  F: { regex: ^(sum|mean|min|max|median|std|var|count)$ }
fix: $R.rolling($$$W).$F()
metadata: { fix: safe }
---
id: rolling-apply
language: python
severity: warning
message: Without raw=True, rolling.apply builds a Series for every window.
rule:
  pattern: $R.apply($$$A)
  has: { field: function, regex: '\.(rolling|expanding)\(.*\)\.apply$' }
  not:
    any:
      - has:
          field: arguments
          has: { kind: keyword_argument, has: { field: name, regex: ^(raw|engine)$ } }
      - pattern: "$R.apply(lambda $X: $X.$F())"
---
id: object-dates
language: python
severity: warning
message: dt.date makes a column of Python objects. Use dt.normalize() or dt.floor("D") to stay in datetime64.
rule:
  any:
    - pattern: $X.dt.date
    - pattern: $X.dt.time
---
id: text-time-key
language: python
severity: warning
message: Grouping on formatted text is slow. Group on dt.to_period or dt.floor instead.
rule:
  pattern: $X.dt.strftime($F)
  inside:
    stopBy: { kind: call }
    kind: call
    has: { field: function, regex: '\.groupby$' }
---
id: literal-contains
language: python
severity: warning
message: This pattern is plain text. Pass regex=False to skip the regex engine.
rule:
  pattern: $X.str.contains($P)
constraints:
  P: { kind: string, regex: '^"[A-Za-z0-9 _,:;@#%&=/<>!~-]*"$' }
fix: $X.str.contains($P, regex=False)
metadata: { fix: safe }
---
id: copy-after-indexing
language: python
severity: warning
message: Copy-on-write already protects the original, so this copy only costs memory and time.
rule:
  pattern: $DF[$I].copy()
fix: $DF[$I]
metadata: { fix: safe }
---
id: copy-after-indexing
language: python
severity: warning
message: Copy-on-write already protects the original, so this copy only costs memory and time.
rule:
  pattern: $DF.loc[$$$I].copy()
fix: $DF.loc[$$$I]
metadata: { fix: safe }
---
id: frame-growth-in-loop
language: python
severity: warning
message: Adding a row at a time copies the frame each time. Collect rows in a list and build the frame once.
rule:
  pattern: $DF.loc[len($DF)] = $ROW
  inside:
    stopBy: end
    any:
      - kind: for_statement
      - kind: while_statement
---
id: replace-with-mapping
language: python
severity: warning
message: replace with a large mapping is slow. Use .map(mapping).fillna(column).
rule:
  pattern: $S.replace($M)
constraints:
  M: { kind: identifier }
---
# ---------------------------------------------------------------- explicit intent
id: merge-without-on
language: python
severity: warning
message: Without on=, merge joins on every shared column name, so a new shared column changes the join.
rule:
  any:
    - pattern: $A.merge($$$ARGS)
    - pattern: pd.merge($$$ARGS)
  not:
    has:
      field: arguments
      has:
        kind: keyword_argument
        any:
          - has: { field: name, regex: ^(on|left_on|right_on|left_index|right_index)$ }
          - regex: ^how="cross"$
---
id: to-csv-index
language: python
severity: warning
message: to_csv writes the index as an unnamed first column. Say index=False or index=True.
rule:
  pattern: $X.to_csv($$$ARGS)
  not:
    has:
      field: arguments
      has: { kind: keyword_argument, has: { field: name, regex: ^index$ } }
---
id: groupby-first-skips-missing
language: python
severity: warning
message: first() takes the first value that is not missing in each column, so one result row can mix rows. Say skipna=False for the first row.
rule:
  any:
    - pattern: $G.first()
    - pattern: $G.last()
  has: { field: function, regex: 'groupby\(' }
---
id: value-counts-share
language: python
severity: warning
message: value_counts(normalize=True) returns shares directly.
rule:
  pattern: $S.value_counts() / len($S)
fix: $S.value_counts(normalize=True)
metadata: { fix: unsafe }
---
id: subtract-shift
language: python
severity: warning
message: diff() is the difference from the previous row.
rule:
  any:
    - pattern: $S - $S.shift()
    - pattern: $S - $S.shift(1)
fix: $S.diff()
metadata: { fix: safe }
---
id: range-mask
language: python
severity: warning
message: between() states the range once.
rule:
  pattern: ($S >= $LO) & ($S <= $HI)
fix: $S.between($LO, $HI)
metadata: { fix: safe }

---
id: groupby-apply-reads-key
language: python
severity: error
message: groupby.apply no longer passes the grouping column to the function, so this lookup raises KeyError. Read the key from g.name.
rule:
  pattern: "$DF.groupby($K).apply(lambda $G: $BODY)"
  has:
    stopBy: end
    pattern: $G[$K]
constraints:
  K: { kind: string }

---
id: aggregate-then-merge-back
language: python
severity: warning
message: transform returns the group result on every row, so the merge is not needed.
rule:
  any:
    - pattern: $DF.merge($$$ARGS)
    - pattern: $DF[$C].map($$$ARGS)
  has:
    field: arguments
    has:
      stopBy: end
      pattern: $DF.groupby($$$K)
