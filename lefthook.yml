pre-commit:
  parallel: true
  jobs:
    - name: cargo fmt
      glob: "*.rs"
      run: cargo fmt
      stage_fixed: true
    - name: clippy
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings

pre-push:
  parallel: true
  jobs:
    - name: test
      run: cargo test --all-features
    - name: deny
      run: cargo deny check
