pre-commit:
  parallel: true
  jobs:
    - name: cargo fmt
      glob: "*.rs"
      run: cargo fmt
      stage_fixed: true
    - name: clippy
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: ruff format
      glob: "py/*.py"
      run: uvx ruff@0.17.4 format {staged_files}
      stage_fixed: true
    - name: ruff check
      glob: "py/*.py"
      run: uvx ruff@0.17.4 check --fix {staged_files}
      stage_fixed: true
    - name: jactionlint
      glob: ".github/**/*.yml"
      run: jactionlint

pre-push:
  jobs:
    - name: deny
      run: cargo deny check
